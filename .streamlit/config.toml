[theme]
# The chart palette was validated against this light surface, so I pin the theme
# rather than let the OS flip it to a surface the colours were never checked on.
base = "light"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f9f9f7"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"

[server]
headless = true
